<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A bilingual (English/Arabic, LTR/RTL) Vue 3 + Vuetify 3 starter template with light/dark themes, auth screens and a config-driven application shell."
    />
    <!-- Customize: match your brand palette (see src/plugins/vuetify.ts). -->
    <meta name="theme-color" content="#4355B9" />
    <title>Vue Vuetify Starter</title>
    <script>
      // Paint the correct background before the app mounts to avoid a theme flash.
      // Customize: keep this localStorage key in sync with `storagePrefix`
      // in src/config/brand.ts (here: `${storagePrefix}.theme`).
      try {
        var stored = localStorage.getItem('starter.theme');
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.appTheme = theme;
      } catch (e) {
        document.documentElement.dataset.appTheme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
