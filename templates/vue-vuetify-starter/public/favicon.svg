<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Starter logo">
  <!-- Original placeholder brand mark: indigo tile + ascending starter blocks.
       Replace with your own logo and update `brand.logoSrc` in src/config/brand.ts. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4355B9"/>
      <stop offset="1" stop-color="#2C3A8C"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#tile)"/>
  <rect x="16" y="36" width="8" height="14" rx="2" fill="#FFFFFF" opacity="0.95"/>
  <rect x="28" y="26" width="8" height="24" rx="2" fill="#FFFFFF" opacity="0.85"/>
  <rect x="40" y="16" width="8" height="34" rx="2" fill="#FFFFFF" opacity="0.75"/>
</svg>
